<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TAM Editor (tldraw spike)</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
      .app { display: flex; height: 100%; }
      .canvas { flex: 1; position: relative; min-width: 0; }
      .side { width: 340px; display: flex; flex-direction: column; border-left: 1px solid #dfe1e6; background: #fff; }
      .side h2 { margin: 12px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #63666d; }
      .side textarea { flex: 1; margin: 0 12px 12px; padding: 8px; border: 1px solid #dfe1e6; border-radius: 6px; background: #f4f5f7; font: 12px/1.5 ui-monospace, Menlo, monospace; resize: none; tab-size: 2; white-space: pre; }
      .problem { margin: 0 12px 12px; padding: 7px 9px; border-radius: 6px; background: #fbeaea; color: #c93a3a; font-size: 12px; }
      .note { margin: 0 12px 10px; color: #63666d; font-size: 12px; }
      .tam-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      .tam-label input { width: 90%; font: 14px system-ui, sans-serif; text-align: center; border: 2px solid #2a78d6; border-radius: 4px; padding: 3px; outline: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
